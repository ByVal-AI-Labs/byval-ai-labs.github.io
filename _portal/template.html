<!doctype html>
<!-- Landing page template. _portal/build_portal.py fills in the section cards on every deploy. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench · ByVal AI Labs</title>
<meta name="description" content="Workbench by ByVal AI Labs: how we build with AI, real apps built that way, and the tools, skills and capabilities behind them.">
<style>
  :root {
    --bg: #f6f6f3; --surface: #ffffff; --surface-2: #efefea; --text: #1c1c1a; --muted: #5d5d57;
    --border: #dfdfd8; --accent: #2b55c9; --accent-soft: #e7edfb;
    --shadow: 0 1px 2px rgba(20, 20, 15, .06), 0 8px 24px rgba(20, 20, 15, .06);
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121315; --surface: #1a1b1e; --surface-2: #232428; --text: #ebebe7; --muted: #a2a29c;
      --border: #303136; --accent: #7d9bff; --accent-soft: #1e2744;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121315; --surface: #1a1b1e; --surface-2: #232428; --text: #ebebe7; --muted: #a2a29c;
    --border: #303136; --accent: #7d9bff; --accent-soft: #1e2744;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header { padding: 56px 0 32px; border-bottom: 1px solid var(--border);
    background: radial-gradient(1200px 300px at 10% -10%, var(--accent-soft), transparent 70%); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 8px 0 12px; font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -.02em; }
  .lede { margin: 0; max-width: 680px; color: var(--muted); font-size: 17px; }
  .count { display: inline-block; margin-top: 18px; font-size: 13px; color: var(--muted); padding: 3px 10px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
  .theme-toggle { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  main { padding: 16px 0 24px; }
  .group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 32px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 20px; min-height: 170px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: inherit;
    text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-2px); outline: none; }
  .card h3 { margin: 0; padding-right: 56px; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); }
  .card-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: auto; padding-top: 10px; font-size: 13px; color: var(--muted); }
  .card-go { position: absolute; top: 20px; right: 20px; font-size: 13px; font-weight: 600; color: var(--accent);
    opacity: 0; transition: opacity .15s; }
  .card:hover .card-go, .card:focus-visible .card-go { opacity: 1; }
  .empty { color: var(--muted); padding: 32px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }
  footer { margin-top: 40px; padding: 24px 0 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); }
  @media (max-width: 560px) { header { padding-top: 36px; } .grid { grid-template-columns: 1fr; } .card-go { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <p class="eyebrow">ByVal AI Labs</p>
        <h1>Workbench</h1>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">◐ Theme</button>
    </div>
    <p class="lede">Where ByVal AI Labs keeps its craft: the process we follow, real apps built with it, and the
      tools, skills and capabilities behind them.</p>
    <span class="count"><!--PORTAL_COUNT--></span>
  </div>
</header>

<main class="wrap">
<!--PORTAL_SECTIONS-->
</main>

<footer>
  <div class="wrap">
    Each section is published by its own repository.
    <a href="https://github.com/ByVal-AI-Labs/byval-ai-labs.github.io#add-a-section">Add a section</a>.
  </div>
</footer>

<script>
(function () {
  "use strict";
  var KEY = "workbench-theme";
  var root = document.documentElement;
  try { var stored = localStorage.getItem(KEY); if (stored === "light" || stored === "dark") root.setAttribute("data-theme", stored); } catch (e) { /* storage unavailable */ }
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var current = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = current === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch (e) { /* storage unavailable */ }
  });
})();
</script>
</body>
</html>
